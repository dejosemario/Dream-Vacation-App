  version: '3.8'

  services: 
    #postgreSql database service
    db: 
      image: postgres:15-alpine
      container_name: dream_vacation_db
      env_file: .env
      ports:
        - "${DB_PORT}:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - dream_vacation_network
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
        interval: 30s
        timeout: 10s
        retries: 3

    # Backend service
    backend:
      image: dejosemario1/dream-vacation-frontend:latest 
      container_name: dvb-container
      env_file: .env
      ports:
        - "${BACKEND_PORT}:${BACKEND_PORT}"
      depends_on:
        db: 
          condition: service_healthy
      networks:
        - dream_vacation_network
      restart: unless-stopped
      
    #Frontend service
    frontend: 
      image: dejosemario1/dream-vacation-frontend:latest
      container_name: dvf-container
      env_file: .env
      ports:
        - "${FRONTEND_PORT}:80"
      depends_on:
        - backend
      networks: 
        - dream_vacation_network
      restart: unless-stopped
    
  volumes:
    postgres_data:
  
  networks:
    dream_vacation_network:
      driver: bridge
