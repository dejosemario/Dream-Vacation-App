name: Build and Deploy App
on:
  push:
    branches:
      - ec2-deployment

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: dejosemario1/dream-vacation-backend
  FRONTEND_IMAGE: dejosemario1/dream-vacation-frontend

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
  
  build-backend:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
  
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [changes, build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e 

            # Navigate to app directory
            mkdir -p /home/ubuntu/dream-vacation-app
            cd /home/ubuntu/dream-vacation-app

            # Clone or pull latest code (to get docker-compose.yml)
            if [ ! -d ".git" ]; then
              git clone https://github.com/dejosemario/Dream-Vacation-App.git .
            else
              git pull origin ec2-deployment
            fi

            # Create .env file with specific SHA tags
            if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}" > .env
            else
            echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:latest" > .env
            fi

            if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" >> .env
            else
            echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:latest" >> .env
            fi

            # Database Configuration
            echo "DB_NAME=dreamvacations" >> .env
            echo "DB_USER=postgres" >> .env
            echo "DB_PASSWORD=letjesusin" >> .env
            echo "DB_HOST=db" >> .env
            echo "DB_PORT=5432" >> .env
            echo "DATABASE_URL=postgresql://postgres:letjesusin@db:5432/dreamvacations" >> .env
            echo "BACKEND_PORT=3001" >> .env
            echo "FRONTEND_PORT=3000" >> .env
            echo "NODE_ENV=production" >> .env
            echo "COUNTRIES_API_BASE_URL=https://restcountries.com/v3.1" >> .env
            echo "REACT_APP_API_URL=http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):3001/api" >> .env

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Only pull images that were actually built - REPLACE THIS SECTION
            if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            fi
  
            if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            fi

            # Stop existing containers
            docker-compose down || true
            
            # Start new containers
            docker-compose up -d
            
            # Verify deployment
            echo "Checking running containers:"
            docker ps
            
            # Clean up unused images
            docker image prune -f

      - name: Check Container Health
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/dream-vacation-app
            
            # Wait for frontend to be ready
            for i in {1..30}; do
              if curl -s http://localhost:3000 >/dev/null; then
                echo "Frontend is up and running!"
                break
              fi
              echo "Waiting for frontend... (attempt $i/30)"
              sleep 2
            done
            
            # Wait for backend to be ready
            for i in {1..30}; do
              if curl -s http://localhost:3001 >/dev/null; then
                echo "Backend is up and running!"
                break
              fi
              echo "Waiting for backend... (attempt $i/30)"
              sleep 2
            done
            
            # Show container status
            echo "=== Container Status ==="
            docker ps -a
            
            # Show container logs for debugging
            echo "=== Database Logs ==="
            docker logs dream_vacation_db --tail 10 || docker logs $(docker ps -q --filter "ancestor=postgres")
            
            echo "=== Backend Logs ==="
            docker logs dvb-container --tail 10 || docker logs $(docker ps -q --filter "name=backend")
            
            echo "=== Frontend Logs ==="
            docker logs dvf-container --tail 10 || docker logs $(docker ps -q --filter "name=frontend")
            
            echo "=== Deployment Health Check Complete ==="






  

            

     

